actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: >-
    No WebSocket protocol surface exists, and TheraNest publishes no documented
    public API at all. The apis.yml entries are logical resource groupings
    modeled from the product surface with endpointsModeled true; no endpoints
    were fabricated and no OpenAPI or AsyncAPI document was created because there
    is no documented public API to describe.
