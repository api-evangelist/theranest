aid: theranest
url: https://raw.githubusercontent.com/api-evangelist/theranest/refs/heads/main/apis.yml
name: TheraNest
kind: company
description: >-
  TheraNest (now marketed as Ensora Mental Health) is a behavioral and mental
  health practice management and EHR platform for therapists, counselors,
  psychologists, and social workers. It covers client intake, scheduling,
  telehealth, clinical documentation and notes, treatment plans, client portals,
  insurance billing and claims, and reporting. TheraNest is the flagship mental
  health product of Ensora Health (formerly Therapy Brands). As of this review,
  Ensora does not publish a documented, self-serve public developer API for
  TheraNest - integration is via partnerships, HIPAA-gated interoperability, and
  contact-sales arrangements rather than an open developer portal. The API
  entries below are logical resource groupings modeled from the product surface;
  their endpoints are NOT documented public endpoints (endpointsModeled true).
