description: >-
  FinOps view of TheraNest (Ensora Mental Health) spend. TheraNest is billed as
  a per-therapist SaaS subscription, not as a metered API. There is no API-usage
  meter, no request-based billing, and no developer plan - programmatic access,
  where it exists, is a negotiated partnership rather than a usage line item.
  The cost model is therefore seat-driven - per-therapist subscription plus
  per-additional-admin-user fees, an annual AMA CPT license fee, and optional
  add-ons such as telehealth on lower tiers. Spend scales with the number of
  clinicians and admin seats, not with API call volume.
notes: >-
  Prices are grounded from Ensora / directory listings as of July 2026 and can
  change; verify on the current pricing page. Because billing is per seat rather
  than per API call, FinOps optimization here is about seat and tier management,
  not throughput.
