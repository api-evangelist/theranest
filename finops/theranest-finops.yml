principles:
- name: Visibility
  description: Track active therapist and admin seats per plan tier; there is no API-usage meter to monitor because billing is per seat, not per request.
- name: Allocation
  description: Map therapist and admin seats to practices, teams, or cost centers so subscription spend is attributable.
- name: Optimization
  description: Right-size the plan tier to the features actually used, reclaim unused seats, and weigh Premier (telehealth included) against Essentials/Advanced plus telehealth add-on.
- name: Accountability
  description: Assign an owner for the subscription; review seat counts and the annual AMA CPT fee against practice headcount each billing cycle.
